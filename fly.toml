# fly.toml app configuration file generated for rayobrowse on 2026-10-16T17:24:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rayobrowse'
primary_region = 'sin'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 9222
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
